name: PromptForge CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          BACKEND_API_URL: https://example.invalid

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          APP_NAME: PromptForge AI
          APP_VERSION: "1.0.0"
          ENVIRONMENT: test
          DEBUG: "false"

          GEMINI_API_KEY: test-key
          GEMINI_MODEL: gemini-test
          GEMINI_TEMPERATURE: "0.2"

          DATABASE_URL: sqlite+pysqlite:///:memory:
          DATABASE_ECHO: "false"

          JWT_SECRET_KEY: ci-test-secret-key
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"

          FRONTEND_URL: http://localhost:3000

          LOG_LEVEL: INFO
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          MAX_REQUEST_SIZE_BYTES: "1100000"
          ENABLE_GZIP: "true"

        run: python -m pytest