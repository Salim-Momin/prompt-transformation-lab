name: PromptForge CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          BACKEND_API_URL: https://example.invalid

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: test
      DEBUG: "false"

      APP_NAME: PromptForge AI
      APP_VERSION: 1.0.0

      GEMINI_API_KEY: test-key-for-ci
      GEMINI_MODEL: gemini-test
      GEMINI_TEMPERATURE: "0.2"

      DATABASE_URL: sqlite+pysqlite:///:memory:
      DATABASE_ECHO: "false"

      JWT_SECRET_KEY: ci-only-test-secret-key-not-used-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

      FRONTEND_URL: http://localhost:3000

      LOG_LEVEL: INFO
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      MAX_REQUEST_SIZE_BYTES: "1100000"
      ENABLE_GZIP: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest

      - name: Run test coverage
        run: python -m pytest --cov=src --cov-report=term-missing